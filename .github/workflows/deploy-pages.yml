name: Deploy W.I.L Pay

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Configure isolated W.I.L Auth
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('src/AppV2.jsx')
          s=p.read_text()
          s=s.replace("const ADMIN_EMAIL='alissoncrpay@gmail.com';", "const ADMIN_EMAIL='admin@wilpay.com.br';")

          old="else{const r=await neon.auth.signIn.email({email:form.email,password:form.password,rememberMe:true});if(r.error)throw new Error(r.error.message)}await onReady()"
          new="else{let r=await neon.auth.signIn.email({email:form.email.trim().toLowerCase(),password:form.password,rememberMe:true});if(r.error&&admin){const first=await neon.auth.signUp.email({name:'Administrador W.I.L Pay',email:ADMIN_EMAIL,password:form.password});if(first.error)throw new Error(first.error.message);r=await neon.auth.signIn.email({email:ADMIN_EMAIL,password:form.password,rememberMe:true});if(r.error)throw new Error(r.error.message)}else if(r.error)throw new Error(r.error.message)}localStorage.setItem('wilpay_session','1');await onReady()"
          if old not in s:
              raise SystemExit('Trecho de autenticação não encontrado')
          s=s.replace(old,new)

          old_session="async function session(){try{const s=await neon.auth.getSession();setUser(s.data?.user||null)}finally{setLoading(false)}}"
          new_session="async function session(){try{const boot='wilpay_boot_v14';if(localStorage.getItem(boot)!=='1'){localStorage.removeItem('wilpay_session');try{await neon.auth.signOut()}catch{}localStorage.setItem(boot,'1');setUser(null);return}const sess=await neon.auth.getSession();const u=sess.data?.user||null;if(u&&!localStorage.getItem('wilpay_session')){try{await neon.auth.signOut()}catch{}setUser(null)}else setUser(u)}finally{setLoading(false)}}"
          if old_session not in s:
              raise SystemExit('Trecho de sessão não encontrado')
          s=s.replace(old_session,new_session)

          s=s.replace("async function signOut(){await neon.auth.signOut();location.reload()}", "async function signOut(){localStorage.removeItem('wilpay_session');await neon.auth.signOut();location.reload()}")
          p.write_text(s)

          sw=Path('public/sw.js')
          if sw.exists():
              txt=sw.read_text()
              txt=txt.replace("CACHE='wil-pay-v1'", "CACHE='wil-pay-v14'")
              sw.write_text(txt)
          PY
      - name: Install
        run: npm install
      - name: Build
        run: npm run build
      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
