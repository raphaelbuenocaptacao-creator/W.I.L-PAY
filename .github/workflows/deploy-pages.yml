name: Deploy W.I.L Pay

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Configure W.I.L Master
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('src/AppV2.jsx')
          s=p.read_text()
          s=s.replace("const ADMIN_EMAIL='alissoncrpay@gmail.com';", "const ADMIN_EMAIL='admin@wilpay.com.br';\nconst ADMIN_AUTH_EMAIL='raphaelbueno.captacao+wilpay@gmail.com';")
          old="else{const r=await neon.auth.signIn.email({email:form.email,password:form.password,rememberMe:true});if(r.error)throw new Error(r.error.message)}await onReady()"
          new="else{const authEmail=admin?ADMIN_AUTH_EMAIL:form.email.trim().toLowerCase();let r=await neon.auth.signIn.email({email:authEmail,password:form.password,rememberMe:true});if(r.error&&admin){const first=await neon.auth.signUp.email({name:'Administrador W.I.L Pay',email:ADMIN_AUTH_EMAIL,password:form.password});if(first.error){r=await neon.auth.signIn.email({email:ADMIN_AUTH_EMAIL,password:form.password,rememberMe:true});if(r.error)throw new Error(r.error.message)}else{r=await neon.auth.signIn.email({email:ADMIN_AUTH_EMAIL,password:form.password,rememberMe:true});if(r.error)throw new Error(r.error.message)}}else if(r.error)throw new Error(r.error.message)}await onReady()"
          if old not in s:
              raise SystemExit('Trecho de autenticação não encontrado')
          s=s.replace(old,new)
          s=s.replace("return user.email?.toLowerCase()===ADMIN_EMAIL?<AdminApp authUser={user}/>:<ClientApp authUser={user}/>", "return [ADMIN_EMAIL,ADMIN_AUTH_EMAIL].includes(user.email?.toLowerCase())?<AdminApp authUser={user}/>:<ClientApp authUser={user}/>")
          p.write_text(s)
          PY
      - name: Install
        run: npm install
      - name: Build
        run: npm run build
      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
